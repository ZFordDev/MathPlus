name: Feature Request
description: Suggest an improvement for MathPlus
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        MathPlus aims to stay tiny and fast. Describe the problem first — the solution might not need to be a new feature.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: What are you trying to do that's currently awkward or impossible?

  - type: textarea
    id: proposal
    attributes:
      label: What are you suggesting?

  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      placeholder: Screenshots, alternatives you considered, etc.
