name: Bug Report
description: Report a reproducible issue in MathPlus
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: MathPlus version
      placeholder: e.g. 1.2.3

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open MathPlus
        2. Type 2 + 2
        3. Press Enter

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots (optional)
